[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-pod"
version = "0.1.0"
description = "Local-first AI video editor: silence removal, repeat-takes, auto-chapters, auto-multicam."
readme = "../README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
auto-pod = "app.cli:app"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app*"]
